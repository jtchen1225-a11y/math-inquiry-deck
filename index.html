<body><main><small>MATH INQUIRY DECK · 小組共用 iPad ＋ 紙本工作紙</small><h1>一起動手探究<br>用證據說明想法</h1><div class="steps"><span>先判斷</span><span>動手調配</span><span>記錄數據</span><span>提出論證</span><span>應用遷移</span></div><p>第 01 週：果汁濃度與比值的本質<br>比較三款標籤，調配飲品，再到數學小法庭說清楚理由。</p><a href="demo/juice/">進入果汁探究課 →</a><ol><li>每組一部 iPad，輪流操作、觀察、記錄與報告。</li><li>在畫面調配與比較，在工作紙寫下數據及理由。</li><li>需要示範或草算時，可展開臨時打字與手寫區。</li></ol><footer>配方比較與臨時書寫只供當次討論，重新整理即清空。<br>源自 mathruffian-dot/math-review-deck，依 MIT 授權延伸。</footer></main></body></html>
