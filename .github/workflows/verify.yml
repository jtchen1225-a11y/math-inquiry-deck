name: Verify inquiry and review modes
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/model.test.cjs tests/schema.test.cjs tests/primary.test.cjs
      - run: python tests/generator_test.py
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser tests
        run: |
          python -m http.server 8890 --bind 127.0.0.1 > /tmp/inquiry-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python -c "import urllib.request,time; time.sleep(1); urllib.request.urlopen('http://127.0.0.1:8890/demo/juice/', timeout=10)"
          node tests/browser.cjs
          node tests/primary-browser.cjs
          TEST_ENGINE=webkit node tests/browser.cjs
          TEST_ENGINE=webkit node tests/primary-browser.cjs
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public classroom website
        run: |
          mkdir -p _site/demo
          cp index.html _site/index.html
          cp -R demo/juice _site/demo/juice
          cp -R primary _site/primary
          mkdir -p _site/assets
          cp assets/*.js assets/*.css _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
